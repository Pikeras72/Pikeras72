# Vuelve a dibujar la tarjeta de estadísticas cada 6 horas con datos frescos de GitHub.
name: Estadísticas

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["generador/**"]

permissions:
  contents: write

jobs:
  dibujar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.58.4 brotli==1.1.0
      - run: python generador/generar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar si algo ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagenes
          git diff --cached --quiet || { git commit -m "Estadísticas al día"; git push; }
